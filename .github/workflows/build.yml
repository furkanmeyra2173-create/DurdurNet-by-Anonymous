name: Build DurdurNet APKS
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug Android App Bundle
        run: gradle --no-daemon bundleDebug
      - name: Install bundletool
        run: |
          curl -L https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o /tmp/bundletool.jar
      - name: Create universal APKS archive
        run: |
          test -f "$HOME/.android/debug.keystore"
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=DurdurNet.apks \
            --mode=universal \
            --ks="$HOME/.android/debug.keystore" \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android \
            --overwrite
      - uses: actions/upload-artifact@v4
        with:
          name: DurdurNet-APKS
          path: DurdurNet.apks
          if-no-files-found: error
